<!-- Dynamic Cartoon Sky & Sunny Meadow Backdrop -->

<!-- Sunbeams & Ambient Glow Effect -->
<div class="absolute inset-0 bg-gradient-to-b from-secondary-container/20 via-transparent to-surface-container/60 pointer-events-none"></div>
<!-- Top HUD & Audio Chip Section -->
<div class="relative z-10 flex items-center justify-between w-full">
<!-- Floating Audio Pronunciation Chip -->
<button aria-label="Listen to village title" class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full shadow-lg transform active:scale-95 transition-transform" id="audioChipBtn" onclick="triggerAudioFeedback()">
<div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-body-lg" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
<span class="font-label-badge text-label-badge tracking-wide">ऐका • LISTEN</span>
</button>
<!-- Gamified Coin / Star HUD Badge -->
<div class="flex items-center gap-1.5 bg-surface-container-highest/95 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-md">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">hotel_class</span>
<span class="font-label-chunky text-label-chunky text-on-surface">५०</span>
</div>
</div>
<!-- Carved 3D Festive Wooden Ribbon Banner -->
<div class="relative z-10 w-full flex flex-col items-center justify-center mt-2">
<div class="relative bg-gradient-to-r from-secondary-container via-secondary-fixed to-secondary-container text-on-secondary-container px-6 py-3 rounded-lg shadow-xl text-center transform -rotate-1 hover:rotate-0 transition-transform">
<!-- Ribbon Golden Accent Studs -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-secondary shadow-md"></div>
<div class="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-secondary shadow-md"></div>
<!-- Bubbly Chubby Devanagari Title -->
<h1 class="font-display-hero-mobile text-display-hero-mobile text-secondary drop-shadow-sm tracking-wide">
            माझे गाव
          </h1>
<!-- English Subtitle Pill Tag -->
<div class="inline-block mt-0.5 bg-surface text-primary px-3 py-0.5 rounded-full shadow-inner">
<span class="font-label-badge text-label-badge tracking-wider uppercase">MAJHE GAON • MY VILLAGE</span>
</div>
</div>
</div>
<!-- Floating Animated Stars / Sparkles Layer -->
<div class="relative z-10 flex justify-between px-6 pointer-events-none">
<span class="material-symbols-outlined text-secondary-container animate-pulse text-headline-lg" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-primary-fixed-dim animate-bounce text-headline-md" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<!-- Centerpiece Character Spotlight Card (NOVA & CHINTU) -->
<div class="relative px-4 -mt-10 z-20">
<div class="relative w-full rounded-xl bg-surface-container-lowest/90 backdrop-blur-md p-4 shadow-xl flex flex-col items-center">
<!-- Speech Bubble from NOVA & Chintu -->
<div class="relative -top-3 bg-primary-container text-on-primary-container px-4 py-2 rounded-lg shadow-md flex items-center gap-2 max-w-xs text-center animate-pulse">
<span class="material-symbols-outlined text-secondary-fixed" style="font-variation-settings: 'FILL' 1;">waving_hand</span>
<span class="font-body-md text-body-md">नमस्ते मित्रा! चल खेळूया!</span>
</div>
<!-- 3D Mascot Character Art Image Container -->
<div class="relative w-full h-64 rounded-lg overflow-hidden bg-gradient-to-t from-tertiary-fixed/30 to-surface-container-high/40 shadow-inner flex items-center justify-center">
<img class="w-full h-full object-cover object-center transform hover:scale-105 transition-transform duration-300" data-alt="Delightful 3D Pixar render of NOVA a joyful compact round electric-blue and glossy white robot with expressive bright cyan eyes, enthusiastically jumping and high-fiving Chintu, a spunky 6-year-old Indian village boy with an orange t-shirt, blue denim shorts, and backwards sports cap, standing on lush cartoon grass with marigold flowers and flying colorful butterflies." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeZV3Xfw2YMSLmeaxk6dnZNpdngt4WZ6TN-Cs5bO2w346bpOwfbbAxbx47rewTdMrorceCfdoEOVQ-HuRuMbQkd3-xBk66wIH_Ea17BdxPoPbqsZrcLfUjWwsnQ1ddMrX7xBNBqAAlPTj9XTJm_dfUsqwNQT_UJhKlkqx_6MSpx1n2BGBCSiVSsRXGTS29oS1M9mtlv3BKeHgk52QAM9yzNWX-3C7ltEDosMKYo06GSmD9Av6re6yk">
<!-- Tactile Replay Voice Greeting Button Over Mascot -->
<button aria-label="Play Chintu and Nova greeting" class="absolute bottom-3 right-3 w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-lg active:scale-90 transition-transform" onclick="speakGreeting()">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Fun Mascot Badges -->
<div class="flex items-center justify-center gap-3 mt-3 w-full">
<div class="flex items-center gap-1.5 bg-surface-container-high px-3 py-1 rounded-full">
<span class="w-3 h-3 rounded-full bg-surface-tint"></span>
<span class="font-label-badge text-label-badge text-on-surface">नोव्हा (NOVA)</span>
</div>
<div class="flex items-center gap-1.5 bg-surface-container-high px-3 py-1 rounded-full">
<span class="w-3 h-3 rounded-full bg-secondary-container"></span>
<span class="font-label-badge text-label-badge text-on-surface">चिंटू (CHINTU)</span>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Interactive Touch Zone: Play Arcade Trigger -->
<div class="w-full px-4 mt-5 flex flex-col items-center gap-3">
<!-- Massive Squishy 3D Jelly Candy Play Button -->
<button class="group relative w-full h-20 rounded-xl bg-tertiary-container text-on-tertiary flex items-center justify-center gap-3 shadow-xl transform active:translate-y-1.5 transition-all overflow-hidden" id="mainPlayButton" onclick="startAdventure()" style="box-shadow: 0 8px 0 #005320, 0 16px 24px rgba(0, 97, 40, 0.35);">
<!-- Glossy Specular Top Highlight Streak -->
<div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/35 to-transparent rounded-t-xl pointer-events-none"></div>
<!-- Big Tactile Play Icon -->
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-headline-lg ml-1" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<!-- Play Button Bilingual Text -->
<div class="flex flex-col items-start leading-tight">
<span class="font-headline-lg text-headline-lg tracking-wide uppercase drop-shadow">खेळा!</span>
<span class="font-label-badge text-label-badge text-on-tertiary-container tracking-wider uppercase">START PLAYING!</span>
</div>
<!-- Sparkle Corner Accent -->
<span class="material-symbols-outlined text-secondary-fixed text-headline-md animate-pulse ml-2" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<!-- Kid-Safe Reassurance Prompt -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant/80 mt-1">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-caption text-caption text-center">१००% मोफत आणि सुरक्षित बाल-मित्र खेळ • Kid-Safe Learning</span>
</div>
</div>
<!-- Floating Audio Ripple Notification Toast -->
<div class="fixed top-12 left-1/2 transform -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none z-50 scale-90" id="audioFeedbackToast">
<span class="material-symbols-outlined text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">sound_detection_loud_sound</span>
<span class="font-body-md text-body-md">"माझे गाव" (Mājhē Gāv)</span>
</div>
</div>
<script>
  function triggerAudioFeedback() {
    const toast = document.getElementById('audioFeedbackToast');
    const chip = document.getElementById('audioChipBtn');
    
    // Tactile bounce effect
    chip.classList.add('scale-110');
    setTimeout(() => chip.classList.remove('scale-110'), 200);

    // Show popup
    toast.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
    toast.classList.add('opacity-100', 'scale-100');

    // Speech synthesis if supported
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance('माझे गाव');
      utterance.lang = 'mr-IN';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    setTimeout(() => {
      toast.classList.remove('opacity-100', 'scale-100');
      toast.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
    }, 2200);
  }

  function speakGreeting() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance('नमस्ते मित्रा! चल खेळूया!');
      utterance.lang = 'mr-IN';
      utterance.rate = 0.85;
      utterance.pitch = 1.3; // Cute energetic kid/robot pitch
      window.speechSynthesis.speak(utterance);
    }
  }

  function startAdventure() {
    const playBtn = document.getElementById('mainPlayButton');
    playBtn.style.transform = 'translateY(6px)';
    playBtn.style.boxShadow = '0 2px 0 #005320, 0 4px 8px rgba(0, 97, 40, 0.25)';
    
    setTimeout(() => {
      playBtn.style.transform = '';
      playBtn.style.boxShadow = '0 8px 0 #005320, 0 16px 24px rgba(0, 97, 40, 0.35)';
      triggerAudioFeedback();
    }, 180);
  }
</script></main></body></html>
