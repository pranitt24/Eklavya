<script>
  // Simple cheerful tactile audio feedback simulator
  function playSpeakerChime(btn) {
    btn.classList.add('scale-110');
    setTimeout(() => btn.classList.remove('scale-110'), 250);
    
    if ('vibrate' in navigator) {
      navigator.vibrate([40, 30, 60]);
    }

    // Audio cue synthesis for delight
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
      osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15); // E5
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3); // G5
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  // Interactive Age Selection
  function selectAge(buttonEl, age) {
    const allAges = document.querySelectorAll('.age-chip');
    allAges.forEach(btn => {
      btn.classList.remove('scale-105', 'selected-age');
      btn.style.transform = 'translateY(0)';
    });

    buttonEl.classList.add('scale-105', 'selected-age');
    if ('vibrate' in navigator) navigator.vibrate(30);
  }

  // Interactive Avatar Selection
  function selectAvatar(cardEl, name) {
    const cards = document.querySelectorAll('.avatar-card');
    cards.forEach(c => {
      c.style.border = 'none';
      c.style.boxShadow = '0 5px 0 #D1C4E9, 0 8px 12px rgba(39,28,68,0.08)';
      const badge = c.querySelector('.avatar-badge');
      if (badge) {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      }
    });

    cardEl.style.border = '4px solid #FFC329';
    cardEl.style.boxShadow = '0 6px 0 #6C47FF, 0 10px 16px rgba(108,71,255,0.3)';
    const currentBadge = cardEl.querySelector('.avatar-badge');
    if (currentBadge) {
      currentBadge.classList.remove('hidden');
      currentBadge.classList.add('flex');
    }

    if ('vibrate' in navigator) navigator.vibrate([30, 40]);
  }

  // Bottom CTA Click Feedback
  function handleGoClick(btn) {
    if ('vibrate' in navigator) navigator.vibrate([50, 40, 100]);
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
    }, 150);
  }
</script></main></body></html>
