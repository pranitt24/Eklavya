<!-- Interactive JavaScript Logic -->
<script>
    let isListening = true;
    let mangoCount = 3;

    function toggleMic() {
      const micBtn = document.getElementById('micButton');
      const text = document.getElementById('speechStateText');
      const ringOuter = document.getElementById('ring-outer');

      isListening = !isListening;

      if (isListening) {
        micBtn.classList.remove('bg-gray-500');
        micBtn.classList.add('bg-[#EF4444]');
        text.innerText = 'ऐकत आहे... बोला: "तीन"! ✨';
        ringOuter.style.display = 'block';
      } else {
        micBtn.classList.remove('bg-[#EF4444]');
        micBtn.classList.add('bg-gray-500');
        text.innerText = 'माईक बंद आहे. टॅप करा! 🎙️';
        ringOuter.style.display = 'none';
      }
    }

    function playAudioPrompt() {
      const speaker = document.getElementById('speakerBtn');
      speaker.classList.add('scale-125', 'bg-tertiary-fixed');
      
      const text = document.getElementById('speechStateText');
      const prev = text.innerText;
      text.innerText = '🔊 "सांगा किती आंबे? तीन!"';

      setTimeout(() => {
        speaker.classList.remove('scale-125', 'bg-tertiary-fixed');
        text.innerText = prev;
      }, 1800);
    }

    function popMango(index) {
      const mango = document.getElementById(`mango-${index}`);
      mango.classList.add('scale-150', 'rotate-12');
      setTimeout(() => {
        mango.classList.remove('scale-150', 'rotate-12');
      }, 300);
    }

    function handleNextStage() {
      const text = document.getElementById('speechStateText');
      text.innerText = '🎉 शाब्बास! बरोबर उत्तर: तीन! 🎉';
      
      const micBtn = document.getElementById('micButton');
      micBtn.classList.add('scale-110');
      setTimeout(() => {
        micBtn.classList.remove('scale-110');
      }, 400);
    }
  </script>
