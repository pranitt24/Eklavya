<script>
    // Micro-interactions and Kid-friendly sound simulation
    function playVoicePrompt() {
      // In real app, plays local Marathi narration audio
      const originalText = document.querySelector('#badge-L1');
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance('जोड्या जुळवा! डावीकडील चित्रे आणि उजवीकडील खुणा जोडा');
        utter.lang = 'mr-IN';
        window.speechSynthesis.speak(utter);
      }
    }

    let isL3Connected = false;
    function selectBadge(id) {
      if (id === 'L3' || id === 'R3') {
        const cable3 = document.getElementById('cable-3');
        const bL3 = document.getElementById('badge-L3').querySelector('div');
        const bR3 = document.getElementById('badge-R3').querySelector('div');
        
        isL3Connected = true;
        cable3.setAttribute('stroke', '#007d35');
        cable3.setAttribute('stroke-width', '7');
        cable3.removeAttribute('stroke-dasharray');
        cable3.setAttribute('opacity', '1');
        cable3.setAttribute('filter', 'url(#glow-green)');

        bL3.className = "w-[68px] h-[68px] rounded-full bg-surface-container-lowest p-1 shadow-lg border-4 border-tertiary-container transition-all transform scale-105 flex items-center justify-center relative";
        bR3.className = "w-[68px] h-[68px] rounded-full bg-surface-container-lowest p-1 shadow-lg border-4 border-tertiary-container transition-all transform scale-105 flex items-center justify-center relative";
      }
    }

    function validateSolution() {
      const modal = document.getElementById('success-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      const star = document.getElementById('star-count');
      star.innerText = parseInt(star.innerText) + 50;
    }

    function dismissCelebration() {
      const modal = document.getElementById('success-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
