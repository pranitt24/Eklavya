<div class="absolute top-1/4 -left-12 w-48 h-48 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-14 left-7 text-secondary-fixed text-xl animate-pulse pointer-events-none">⭐</div>
<div class="absolute top-36 right-8 text-tertiary-fixed text-sm animate-pulse pointer-events-none" style="animation-delay: 1s;">✨</div>
<div class="absolute top-1/2 left-4 text-secondary-container text-2xl animate-pulse pointer-events-none" style="animation-delay: 1.5s;">🌟</div>
<div class="absolute bottom-40 right-6 text-secondary-fixed text-lg animate-pulse pointer-events-none" style="animation-delay: 0.7s;">⭐</div>
<div class="absolute bottom-24 left-6 text-tertiary-fixed-dim text-xl animate-pulse pointer-events-none" style="animation-delay: 2s;">✨</div>

<div class="w-full flex items-center justify-between z-20 shrink-0">
<div class="bg-surface-container-highest/90 backdrop-blur-md rounded-full pl-1.5 pr-4 py-1.5 flex items-center gap-2 shadow-lg border border-white/20">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm">
<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">movie</span>
</div>
<span class="font-label-badge text-label-badge text-inverse-surface font-extrabold tracking-wide">सिनेमा मोड • Cinema Mode</span>
</div>
<!-- Round speaker button with glow -->
<button aria-label="Listen aloud" class="relative group active:translate-y-1 transition-transform" id="narratorBtn" type="button">
<div class="w-13 h-13 p-3 rounded-full bg-secondary-container flex items-center justify-center shadow-lg active:shadow-sm ring-4 ring-secondary-container/30">
<span class="material-symbols-outlined text-on-secondary-container text-2xl" id="speakerIcon" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</div>
</button>
</div>
<!-- Center Balanced Section: Illustration + Headings -->
<div class="relative w-full flex-1 flex flex-col items-center justify-center py-2 z-10 max-h-[62vh]">
<!-- Dynamic Rotating Guide Halo Behind the Tablet -->
<div class="absolute w-72 h-72 rounded-full bg-primary-fixed-dim/20 blur-3xl pointer-events-none"></div>
<!-- Mascot + Tablet Interactive Story Illustration Container -->
<div class="relative w-full max-w-[280px] sm:max-w-[320px] aspect-square flex items-center justify-center">
<!-- Main 3D Scene Asset -->
<div class="relative w-full h-full rounded-xl flex items-center justify-center shadow-2xl overflow-hidden ring-4 ring-white/15 bg-black/20">
<img class="w-full h-full object-cover rounded-xl" data-alt="In a whimsical magical starry twilight Indian village atmosphere, a vibrant round 3D electric-blue robot named NOVA strains hilariously with tiny joyful effort, physically gripping and rotating a chunky glowing futuristic toy tablet 90 degrees from portrait to landscape orientation. On the glowing tablet screen, cheerful village boy Chintu waves happily against a sunlit banyan tree with a big movie cinema clapboard icon. Bright neon rainbow swirl arrows wrap around the device. 3D toybox clay-render style, friendly Pixar aesthetic, vibrant gem colors, sparkling ambient stardust." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1pkUIDk19Gg9XKQC8M6xB7-TECGdW_gfD_H48PgZF8UM5e2xXl_2kPY_GmPFlKgA3Iz1e-nKFnvtbsP4bt0K1Id1CzsjOpW1gL6VCklYO4DcQc_G5wV08VqFgEhZSy6PPkGij8vJbokWhrbObzK8IzXyrft_zhHnuzczkrxcaGorSUpW52-YdPQcePa9lCLgsr8rp7iU8H37r8wW7dmwoeghhUSh4zf0R-ur-o-JRupMc3j3EWUs7">
<!-- Live Overlay Graphic: Orbit & Rotating Badges -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="w-[90%] h-[90%] rounded-full border-4 border-dashed border-secondary-container/70 animate-spin" style="animation-duration: 14s;"></div>
<!-- 90 Deg Badge -->
<div class="absolute -top-2 bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full shadow-lg flex items-center gap-1 font-label-badge text-label-badge animate-bounce border-2 border-white/60">
<span class="material-symbols-outlined text-base font-bold">screen_rotation</span>
<span>९०°</span>
</div>
<!-- Rotate Action Pill -->
<div class="absolute -bottom-2 bg-tertiary-fixed text-on-tertiary-fixed font-label-badge text-label-badge px-3.5 py-1 rounded-full shadow-lg flex items-center gap-1 border-2 border-white/60">
<span class="material-symbols-outlined text-base font-bold">sync</span>
<span>Rotate!</span>
</div>
</div>
</div>
</div>
<!-- Bubbly Big Toy Typography with Warm Glow -->
<div class="flex flex-col items-center text-center mt-3 z-10 px-2 shrink-0">
<h1 class="font-display-hero-mobile text-display-hero-mobile text-white drop-shadow-[0_4px_16px_rgba(255,195,41,0.65)] tracking-wide flex items-center justify-center gap-2">
<span>फोन आडवा करा!</span>
<span class="text-secondary-container animate-pulse">✨</span>
</h1>
<!-- Playful Subtitle Pill -->
<div class="mt-2 bg-surface-container-highest/95 border border-white/20 px-4 py-1 rounded-full shadow-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-base" style="font-variation-settings: 'FILL' 1;">screen_rotation</span>
<p class="font-body-md text-body-md text-inverse-surface font-extrabold">
          (Turn your phone sideways!)
        </p>
</div>
</div>
</div>
<!-- Bottom Docked Area: 68px Jelly Emerald Button + Reassuring Hint Pill -->
<div class="w-full max-w-sm mx-auto flex flex-col items-center gap-2.5 z-20 shrink-0 mb-1">
<!-- Giant 68px 3D jelly emerald green candy button -->
<button class="group relative w-full h-[68px] rounded-lg bg-tertiary active:translate-y-[5px] transition-transform duration-75 flex items-center justify-center shadow-2xl cursor-pointer border-t border-tertiary-fixed/40" id="turnedConfirmBtn" style="box-shadow: 0 10px 28px rgba(0, 125, 53, 0.55);" type="button">
<!-- 3D Bottom Lip / Extrusion -->
<div class="absolute -bottom-[5px] inset-x-0 h-[5px] bg-tertiary-container rounded-b-lg group-active:h-0 transition-all"></div>
<!-- Gloss Rim Highlight -->
<div class="absolute top-1.5 inset-x-5 h-[3px] bg-white/40 rounded-full pointer-events-none"></div>
<!-- Button Content -->
<div class="relative flex items-center justify-center gap-2 text-white">
<span class="font-label-chunky text-label-chunky tracking-wide drop-shadow-[0_2px_0_rgba(0,0,0,0.4)] flex items-center gap-2">
<span>चला!</span>
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">thumb_up</span>
<span class="text-sm font-body-md font-bold opacity-95">(OK! I TURNED IT)</span>
</span>
</div>
</button>
<!-- Dark Translucent Pill Hint -->
<div class="bg-black/40 backdrop-blur-md border border-white/15 px-4 py-1.5 rounded-full flex items-center gap-2 text-white/90 shadow-sm max-w-full">
<span class="material-symbols-outlined text-base text-secondary-container shrink-0" style="font-variation-settings: 'FILL' 1;">movie</span>
<span class="font-caption text-caption text-center truncate">गोष्टीची मोठी स्क्रीन सुरू होत आहे! 🎬 • Story starts in wide-screen!</span>
</div>
</div>
<!-- Confetti Celebration Splash Overlay (Hidden by Default) -->
<div class="fixed inset-0 pointer-events-none hidden items-center justify-center z-50 bg-black/60 backdrop-blur-sm" id="celebrationOverlay">
<div class="bg-surface-container-highest p-space-lg rounded-xl shadow-2xl flex flex-col items-center text-center max-w-xs mx-auto animate-bounce border-4 border-secondary-container">
<div class="text-5xl mb-2">🎉🎬🌟</div>
<div class="font-headline-md text-headline-md text-primary font-black">शाब्बास! Superb!</div>
<div class="font-body-md text-body-md text-inverse-surface font-bold mt-1">NOVA is opening the magical cinema!</div>
</div>
</div>
</main>
<script>
  (function() {
    const audioBtn = document.getElementById('narratorBtn');
    const speakerIcon = document.getElementById('speakerIcon');
    const confirmBtn = document.getElementById('turnedConfirmBtn');
    const overlay = document.getElementById('celebrationOverlay');

    let isSpeaking = false;

    // Speech narration trigger for pre-reading kids
    audioBtn.addEventListener('click', () => {
      isSpeaking = !isSpeaking;
      if (isSpeaking) {
        audioBtn.classList.add('scale-110');
        speakerIcon.textContent = 'volume_up';
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance('फोन आडवा करा! Turn your phone sideways for the village story!');
          utterance.rate = 0.9;
          utterance.onend = () => {
            isSpeaking = false;
            audioBtn.classList.remove('scale-110');
          };
          window.speechSynthesis.speak(utterance);
        } else {
          setTimeout(() => {
            isSpeaking = false;
            audioBtn.classList.remove('scale-110');
          }, 1800);
        }
      } else {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        audioBtn.classList.remove('scale-110');
      }
    });

    // Tactile action trigger
    confirmBtn.addEventListener('click', () => {
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      
      // Haptic feedback if supported on child mobile device
      if (navigator.vibrate) {
        navigator.vibrate([40, 60, 40]);
      }

      setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }, 2200);
    });
  })();
</script></body></html>
