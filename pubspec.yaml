    - assets/nova/backgrounds/
    - assets/nova/characters/
    - assets/nova/animals/
    - assets/nova/props/
    - assets/nova/environment/
    - assets/nova/demo/
    - assets/audio/
    - assets/images/characters/
    - assets/images/logo/
    - assets/images/screens/
    - assets/images/components/
    - assets/majhe_gaon_kid_friendly_3d_toy_logo/
